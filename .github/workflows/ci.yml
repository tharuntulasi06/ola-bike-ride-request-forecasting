name: ML Pipeline CI Workflow & Code Quality Audit

on:
  push:
    branches: [ main, feature/*, isss ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated Unit Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Verify Feature Engineering & Data Loader Pipelines
        run: |
          python src/data_loader.py
          python src/feature_builder.py

      - name: Verify Model Training & Evaluation Suite
        run: |
          python src/train.py
          python src/evaluate.py
